name: quorum-custody
services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_USER: quorum_admin
      POSTGRES_DB: quorum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run provision first}
    ports: ["127.0.0.1:${QUORUM_DB_PORT:-45432}:5432"]
    volumes: ["quorum-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum_admin -d quorum"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  quorum-postgres:
