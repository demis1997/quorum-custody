name: Real custody verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Native prerequisites (Clang 20)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make perl curl gnupg ca-certificates
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20
      - name: Pinned Anvil release
        run: |
          mkdir -p .build/foundry
          curl -fL https://github.com/foundry-rs/foundry/releases/download/v1.3.1/foundry_v1.3.1_linux_amd64.tar.gz -o .build/foundry.tar.gz
          tar -xzf .build/foundry.tar.gz -C .build/foundry anvil
          echo "$PWD/.build/foundry" >> "$GITHUB_PATH"
          .build/foundry/anvil --version
      - name: Real native build and demo
        env:
          CC: clang-20
          CXX: clang++-20
          QUORUM_DEMO_CONTROLS: '1'
        run: |
          set -o pipefail
          mkdir -p .build/reports
          make demo 2>&1 | tee .build/reports/demo.txt
      - name: Types, lint, build and property tests
        run: |
          set -o pipefail
          make check 2>&1 | tee .build/reports/check.txt
      - name: Real dashboard and browser approval
        run: |
          set -o pipefail
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.build/browsers" npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.build/browsers" node --import tsx scripts/screenshots.ts 2>&1 | tee .build/reports/browser.txt
      - name: Real integration boundaries
        run: |
          set -o pipefail
          make integration 2>&1 | tee .build/reports/integration.txt
      - name: Failure demonstration and encrypted recovery
        run: |
          set -o pipefail
          npm run resilience 2>&1 | tee .build/reports/resilience.txt
      - name: Project-only teardown
        if: always()
        run: make stop
      - name: Verification evidence (no generated credentials or traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            .build/reports/*.txt
            docs/images/*.png
          if-no-files-found: ignore
